openapi: 3.0.3
info:
  title: Ktor Final Task Server
  version: 1.0.0
  description: CRUD задач, JWT, роли USER/ADMIN, PostgreSQL и WebSocket уведомления.
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, example: artem }
        password: { type: string, example: "123456" }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, example: artem }
        password: { type: string, example: "123456" }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Новая задача }
        description: { type: string, example: Описание }
        done: { type: boolean, example: false }
    UpdateTaskRequest:
      type: object
      required: [title, description, done]
      properties:
        title: { type: string }
        description: { type: string }
        done: { type: boolean }
    Task:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        done: { type: boolean }
        ownerId: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer }
        login: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
    Error:
      type: object
      properties:
        message: { type: string }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя с ролью USER
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Пользователь создан }
        '400': { description: Неверные данные }
        '409': { description: Логин уже существует }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход и получение JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: JWT выдан }
        '401': { description: Неверный логин или пароль }

  /tasks:
    get:
      tags: [Tasks]
      summary: Получить все задачи
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      tags: [Tasks]
      summary: Создать задачу
      description: Доступно USER и ADMIN. Владелец берётся из JWT.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201': { description: Задача создана }
        '400': { description: Неверные данные }
        '401': { description: Нет валидного JWT }

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Tasks]
      summary: Получить задачу по id
      responses:
        '200': { description: Задача найдена }
        '400': { description: Неверный id }
        '404': { description: Задача не найдена }
    put:
      tags: [Tasks]
      summary: Изменить задачу
      description: USER может менять свою задачу, ADMIN — любую.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200': { description: Задача обновлена }
        '401': { description: Нет валидного JWT }
        '403': { description: Нет прав }
        '404': { description: Задача не найдена }
    delete:
      tags: [Tasks]
      summary: Удалить задачу
      description: Доступно только ADMIN.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Задача удалена }
        '401': { description: Нет валидного JWT }
        '403': { description: Требуется роль ADMIN }
        '404': { description: Задача не найдена }

  /admin/users:
    get:
      tags: [Admin]
      summary: Получить список пользователей
      description: Доступно только ADMIN. Пароли и хэши в ответ не попадают.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { description: Нет валидного JWT }
        '403': { description: Требуется роль ADMIN }

  /ws/tasks:
    get:
      tags: [WebSocket]
      summary: WebSocket уведомления о задачах
      description: >-
        Подключение: ws://localhost:8080/ws/tasks. Сервер отправляет события
        CONNECTED, TASK_CREATED, TASK_UPDATED и TASK_DELETED в JSON.
      responses:
        '101': { description: Switching Protocols }
